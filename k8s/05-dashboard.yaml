apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
     containers:
        - name: dashboard
          image: ecommerce-pipeline
          imagePullPolicy: Never
          command: ["streamlit", "run", "src/dashboard.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
          env:
            - { name: DATA_FOLDER, value: "/pipeline-data/" }
          ports:
            - containerPort: 8501
          volumeMounts:
            - name: data
              mountPath: /pipeline-data
            - name: data
              mountPath: /app/data/quarantine
              subPath: quarantine
          volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pipeline-data
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
spec:
  selector:
    app: dashboard
  ports:
    - port: 8501
      targetPort: 8501