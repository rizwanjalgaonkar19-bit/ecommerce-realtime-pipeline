apiVersion: batch/v1
kind: Job
metadata:
  name: validator
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: validator
          image: ecommerce-pipeline
          imagePullPolicy: Never
          command: ["python", "-m", "src.stream_validator"]
          env:
            - { name: KAFKA_BOOTSTRAP, value: "kafka:19092" }
          volumeMounts:
            - name: data
              mountPath: /app/data/quarantine
              subPath: quarantine
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pipeline-data